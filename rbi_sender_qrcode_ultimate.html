<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Code128 極速純文字傳送端</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .barcode-box { background: #fff; padding: 20px; border-radius: 8px; }
    .controls { margin-bottom: 20px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">啟動 Code128 光學字串流</button>
</div>

<div class="barcode-box">
  <svg id="barcode"></svg>
</div>

<div id="status" style="margin-top: 15px; font-size: 18px; color: #00ff00; font-weight: bold;">等待檔案...</div>

<script>
const CHUNK_SIZE = 60; // 60 字元單條碼，條線清晰度最高、解碼速度最快
let chunks = [];
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const uint8Array = new Uint8Array(e.target.result);
    let binary = '';
    for (let i = 0; i < uint8Array.byteLength; i++) {
      binary += String.fromCharCode(uint8Array[i]);
    }
    const base64Data = window.btoa(binary);

    chunks = [];
    for (let i = 0; i < base64Data.length; i += CHUNK_SIZE) {
      chunks.push(base64Data.slice(i, i + CHUNK_SIZE));
    }
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總條碼數：${chunks.length}，Code128 高頻廣播中...`;
    
    playFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playFrame() {
  if (!isTransmitting) return;

  const data = chunks[frameIndex];
  // Header 格式：00001/00100|payload
  const payload = String(frameIndex).padStart(5, '0') + '/' + String(chunks.length).padStart(5, '0') + '|' + data;

  JsBarcode("#barcode", payload, {
    format: "CODE128",
    width: 2,
    height: 120,
    displayValue: true,
    fontSize: 16,
    background: "#ffffff",
    lineColor: "#000000"
  });

  frameIndex = (frameIndex + 1) % chunks.length;

  setTimeout(() => {
    requestAnimationFrame(playFrame);
  }, 25); // 約 40 FPS 刷新
}
</script>
</body>
</html>
