<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>純文字 Base64 光學傳送端</title>
  <style>
    body { background: #000; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #display-box { width: 650px; height: 350px; background: #111; border: 4px solid #00ff00; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    #text-content { font-size: 28px; font-weight: bold; letter-spacing: 2px; word-break: break-all; color: #ffffff; text-align: center; line-height: 1.4; }
    #header { font-size: 20px; color: #00ff00; margin-bottom: 15px; background: #222; padding: 4px 12px; border-radius: 4px; }
    .controls { margin-bottom: 20px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">啟動 Base64 高頻文字流</button>
</div>

<div id="display-box">
  <div id="header">READY</div>
  <div id="text-content">請選擇檔案並點擊啟動...</div>
</div>

<div id="status" style="margin-top: 15px; font-size: 18px; color: #00ff00; font-weight: bold;">等待中...</div>

<script>
const CHUNK_SIZE = 120; // 每幀顯示 120 個字元，字體夠大、OCR 辨識率最高
let chunks = [];
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const uint8Array = new Uint8Array(e.target.result);
    let binary = '';
    for (let i = 0; i < uint8Array.byteLength; i++) {
      binary += String.fromCharCode(uint8Array[i]);
    }
    const base64Data = window.btoa(binary);

    chunks = [];
    for (let i = 0; i < base64Data.length; i += CHUNK_SIZE) {
      chunks.push(base64Data.slice(i, i + CHUNK_SIZE));
    }
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總切片數：${chunks.length}，Base64 光學文字流廣播中...`;
    
    playFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playFrame() {
  if (!isTransmitting) return;

  const data = chunks[frameIndex];
  // Header 格式：[00001/00100]
  const headerText = `[${String(frameIndex).padStart(5, '0')}/${String(chunks.length).padStart(5, '0')}]`;
  
  document.getElementById('header').textContent = headerText;
  document.getElementById('text-content').textContent = data;

  frameIndex = (frameIndex + 1) % chunks.length;

  setTimeout(() => {
    requestAnimationFrame(playFrame);
  }, 33); // 約 30 FPS 極速滾動
}
</script>
</body>
</html>
