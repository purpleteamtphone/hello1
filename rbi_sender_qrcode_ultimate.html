<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>4X 宮格超光速傳送端</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .grid { display: grid; grid-template-columns: 180px 180px; gap: 10px; padding: 10px; background: #fff; border-radius: 8px; }
    .qr-box { width: 180px; height: 180px; }
    .controls { margin-bottom: 15px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">啟動 4 通道矩陣噴射</button>
</div>

<div class="grid">
  <canvas id="c0" width="180" height="180"></canvas>
  <canvas id="c1" width="180" height="180"></canvas>
  <canvas id="c2" width="180" height="180"></canvas>
  <canvas id="c3" width="180" height="180"></canvas>
</div>

<div id="q0" class="hidden"></div>
<div id="q1" class="hidden"></div>
<div id="q2" class="hidden"></div>
<div id="q3" class="hidden"></div>

<div id="status" style="margin-top: 15px; font-weight: bold; color: #00ff00;">等待啟動...</div>

<script>
const qrs = [
  new QRCode(document.getElementById('q0'), { width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L }),
  new QRCode(document.getElementById('q1'), { width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L }),
  new QRCode(document.getElementById('q2'), { width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L }),
  new QRCode(document.getElementById('q3'), { width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L })
];

const canvases = [
  document.getElementById('c0').getContext('2d'),
  document.getElementById('c1').getContext('2d'),
  document.getElementById('c2').getContext('2d'),
  document.getElementById('c3').getContext('2d')
];

const CHUNK_SIZE = 250; // 單條碼精準 Byte 容納量
let chunks = [];
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const uint8Array = new Uint8Array(e.target.result);
    // 使用 Latin-1 保留原始 Byte 資料，免除 Base64 膨脹
    let binary = '';
    for (let i = 0; i < uint8Array.byteLength; i++) {
      binary += String.fromCharCode(uint8Array[i]);
    }

    chunks = [];
    for (let i = 0; i < binary.length; i += CHUNK_SIZE) {
      chunks.push(binary.slice(i, i + CHUNK_SIZE));
    }
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總影格切片：${chunks.length}，4 通道全速廣播中...`;
    
    playFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playFrame() {
  if (!isTransmitting) return;

  for (let ch = 0; ch < 4; ch++) {
    const idx = frameIndex + ch;
    if (idx < chunks.length) {
      const header = String(idx).padStart(5, '0') + '/' + String(chunks.length).padStart(5, '0') + '|';
      const payload = header + chunks[idx];

      qrs[ch].clear();
      qrs[ch].makeCode(payload);

      const img = document.getElementById(`q${ch}`).querySelector('img');
      if (img && img.complete) {
        canvases[ch].drawImage(img, 0, 0, 180, 180);
      }
    } else {
      canvases[ch].fillStyle = "#FFF";
      canvases[ch].fillRect(0,0,180,180);
    }
  }

  frameIndex += 4;
  if (frameIndex >= chunks.length) frameIndex = 0;

  setTimeout(() => {
    requestAnimationFrame(playFrame);
  }, 20); // 50 FPS 極速刷新
}
</script>
</body>
</html>
