<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RGB 色彩光學極速傳送端</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    canvas { background: #000; border: 4px solid #fff; }
    .controls { margin-bottom: 20px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">啟動 RGB 矩陣全速噴射</button>
</div>

<canvas id="matrixCanvas" width="400" height="400"></canvas>

<div id="status" style="margin-top: 15px; font-size: 18px; color: #00ff00; font-weight: bold;">等待檔案...</div>

<script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');

// 16x16 個色塊，每個影格直接塞 256 Bytes（無 Base64 膨脹，純原生 Byte）
const GRID_SIZE = 16;
const BLOCK_SIZE = 400 / GRID_SIZE;
const CHUNK_SIZE = GRID_SIZE * GRID_SIZE - 4; // 預留 4 格做 Header

let fileBytes = null;
let totalChunks = 0;
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    fileBytes = new Uint8Array(e.target.result);
    totalChunks = Math.ceil(fileBytes.length / CHUNK_SIZE);
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總色塊影格：${totalChunks}，RGB 色彩陣列噴射中...`;
    
    playFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playFrame() {
  if (!isTransmitting) return;

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, 400, 400);

  // 定位角標（左上角紅，右上角綠，左下角藍，方便接收端定位）
  drawBlock(0, 0, 255, 0, 0);
  drawBlock(15, 0, 0, 255, 0);
  drawBlock(0, 15, 0, 0, 255);

  // Header: 影格編號 (High & Low Byte)
  const offset = frameIndex * CHUNK_SIZE;
  const chunkData = fileBytes.subarray(offset, offset + CHUNK_SIZE);

  drawBlock(15, 15, (frameIndex >> 8) & 0xFF, frameIndex & 0xFF, (totalChunks >> 8) & 0xFF);

  let dataIdx = 0;
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      // 避開 4 個定位角標
      if ((x===0&&y===0) || (x===15&&y===0) || (x===0&&y===15) || (x===15&&y===15)) continue;

      if (dataIdx < chunkData.length) {
        const val = chunkData[dataIdx];
        // 單 Byte 直接轉灰階/RGB 高效色塊
        drawBlock(x, y, val, val, val);
        dataIdx++;
      }
    }
  }

  frameIndex = (frameIndex + 1) % totalChunks;

  setTimeout(() => {
    requestAnimationFrame(playFrame);
  }, 16); // 60 FPS 刷新
}

function drawBlock(x, y, r, g, b) {
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
}
</script>
</body>
</html>
