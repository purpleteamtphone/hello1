<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Base64 Chunk Sender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        h2 { color: #00ffcc; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        input[type="file"] { margin-top: 5px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        select, input[type="number"] { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; }
        .chunk-box { background: #111; border: 1px solid #333; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        textarea { width: 100%; height: 120px; background: #000; color: #00ff00; border: 1px solid #444; padding: 10px; font-family: monospace; font-size: 12px; resize: vertical; }
        button { background: #00ffcc; border: none; color: #000; font-weight: bold; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #00cca3; }
        .nav-btn { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .info { font-size: 0.9rem; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>1. RBI 傳送端：檔案轉 Base64 文字塊</h2>

    <div class="input-group">
        <label>選擇檔案：</label><br>
        <input type="file" id="fileInput">
    </div>

    <div class="controls">
        <label>每塊大小 (KB)：</label>
        <input type="number" id="chunkSizeKb" value="32" min="4" max="512" style="width: 80px;">
        <span class="info">(貼上限制較嚴時建議調小，如 8KB ~ 32KB)</span>
    </div>

    <div id="outputArea" style="display: none;">
        <div class="nav-btn">
            <span id="chunkStatus" style="color: #00ffcc; font-weight: bold;">Chunk 1 / 1</span>
            <div>
                <button id="prevBtn">上一塊</button>
                <button id="nextBtn">下一塊</button>
                <button id="copyBtn" style="background: #ffaa00;">複製當前文字塊</button>
            </div>
        </div>

        <div class="chunk-box" style="margin-top: 10px;">
            <textarea id="chunkText" readonly></textarea>
        </div>
        <div class="info" id="fileMeta"></div>
    </div>
</div>

<script>
    let chunks = [];
    let currentIdx = 0;
    let fileName = "";
    let totalSize = 0;

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileName = file.name;
        totalSize = file.size;
        const chunkSize = parseInt(document.getElementById('chunkSizeKb').value) * 1024;

        const reader = new FileReader();
        reader.onload = (evt) => {
            const arrayBuffer = evt.target.result;
            // 轉為 Base64 字串
            const bytes = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const fullBase64 = btoa(binary);

            // 切分 Base64 字串
            chunks = [];
            for (let i = 0; i < fullBase64.length; i += chunkSize) {
                chunks.push(fullBase64.substring(i, i + chunkSize));
            }

            currentIdx = 0;
            document.getElementById('outputArea').style.display = 'block';
            updateChunkView();
        };
        reader.readAsArrayBuffer(file);
    });

    function updateChunkView() {
        const total = chunks.length;
        // 封裝自帶 Header 的 Chunk 協定格式:
        // [HEADER]|FILENAME|TOTAL_CHUNKS|CURRENT_INDEX|PAYLOAD
        const header = `HEADER|${encodeURIComponent(fileName)}|${total}|${currentIdx + 1}|`;
        const payload = header + chunks[currentIdx];

        document.getElementById('chunkText').value = payload;
        document.getElementById('chunkStatus').innerText = `文字塊 [ ${currentIdx + 1} / ${total} ]`;
        document.getElementById('fileMeta').innerText = `檔名: ${fileName} | 檔案大小: ${(totalSize / 1024).toFixed(1)} KB | 本塊長度: ${payload.length} 字元`;

        document.getElementById('prevBtn').disabled = (currentIdx === 0);
        document.getElementById('nextBtn').disabled = (currentIdx === total - 1);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentIdx > 0) { currentIdx--; updateChunkView(); }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentIdx < chunks.length - 1) { currentIdx++; updateChunkView(); }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const textArea = document.getElementById('chunkText');
        textArea.select();
        document.execCommand('copy');
        alert(`已複製第 ${currentIdx + 1} 塊文字！請貼至本機接收端。`);
    });
</script>
</body>
</html>
