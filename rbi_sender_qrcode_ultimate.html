<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>RBI Optical Sender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; text-align: center; }
        #matrixContainer { display: flex; justify-content: center; margin: 20px 0; }
        canvas { background: #000; border: 4px solid #333; image-rendering: pixelated; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        textarea { width: 80%; height: 80px; background: #111; color: #00ff00; border: 1px solid #444; padding: 10px; }
        button { padding: 10px 20px; background: #00ffcc; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>RBI 傳送端 (Sender - Inside RBI)</h2>
    <div id="matrixContainer">
        <canvas id="txCanvas" width="512" height="512"></canvas>
    </div>

    <textarea id="dataInput" placeholder="輸入要傳出 RBI 的資料...">Text sent from Remote Browser Isolation (RBI) environment via Optical Color Matrix.</textarea>
    
    <div class="controls">
        <button id="sendBtn">開始光學廣播</button>
        <button id="fullScreenBtn">全螢幕切換 (避免 RBI 邊框干擾)</button>
    </div>

<script>
    const GRID_SIZE = 16;
    const canvas = document.getElementById('txCanvas');
    const ctx = canvas.getContext('2d');
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let clockState = 0; // 0: Black, 1: White
    let timer = null;

    function renderFrame(payloadBytes) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let byteIdx = 0;

        for (let row = 0; row < GRID_SIZE; row++) {
            for (let col = 0; col < GRID_SIZE; col++) {
                const x = col * CELL_SIZE;
                const y = row * CELL_SIZE;

                // 1. 定位與校正標記 (4角 Anchor)
                if (row === 0 && col === 0) {
                    ctx.fillStyle = 'rgb(255, 0, 0)'; // 左上: 純紅
                } else if (row === 0 && col === GRID_SIZE - 1) {
                    ctx.fillStyle = 'rgb(0, 255, 0)'; // 右上: 純綠
                } else if (row === GRID_SIZE - 1 && col === 0) {
                    ctx.fillStyle = 'rgb(0, 0, 255)'; // 左下: 純藍
                } else if (row === GRID_SIZE - 1 && col === GRID_SIZE - 1) {
                    // 右下: Clock Sync 閃爍訊號 (用於防重複採樣)
                    ctx.fillStyle = clockState ? 'rgb(255, 255, 255)' : 'rgb(0, 0, 0)';
                } else {
                    // 2. 資料色塊填充 (灰階對應)
                    if (byteIdx < payloadBytes.length) {
                        const val = payloadBytes[byteIdx++];
                        ctx.fillStyle = `rgb(${val}, ${val}, ${val})`;
                    } else {
                        ctx.fillStyle = 'rgb(0, 0, 0)';
                    }
                }
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            }
        }
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        if (timer) clearInterval(timer);

        const text = document.getElementById('dataInput').value;
        const bytes = new TextEncoder().encode(text);

        // 每 100ms 切換 Clock 狀態，對應約 10 FPS（可抵禦 RBI 視訊延遲與掉幀）
        timer = setInterval(() => {
            clockState = clockState === 0 ? 1 : 0;
            renderFrame(bytes);
        }, 100);
    });

    document.getElementById('fullScreenBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            canvas.requestFullscreen().catch(err => alert(err.message));
        } else {
            document.exitFullscreen();
        }
    });

    // 初始化渲染預設畫面
    renderFrame(new TextEncoder().encode("RBI Data Transfer Initialized"));
</script>
</body>
</html>
