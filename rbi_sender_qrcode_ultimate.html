<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Optical Text Streamer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; overflow: hidden; }
        .container { max-width: 900px; margin: 0 auto; text-align: center; }
        .controls { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, select, button { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 12px; font-weight: bold; margin: 5px; cursor: pointer; }
        button:hover { background: #00ffcc; color: #000; }
        
        /* 光學辨識專用核心顯示區 */
        #displayBox {
            background: #ffffff;
            color: #000000;
            padding: 30px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
            text-align: left;
            font-size: 20px;
            line-height: 1.4;
            font-weight: 900;
            letter-spacing: 1px;
            min-height: 320px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .header-tag { color: #d00000; font-weight: 900; }
        .progress-bar { width: 100%; background: #333; height: 10px; margin-top: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.1s; }
        .meta-info { font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>RBI 自動文字光學傳送端</h2>
        <input type="file" id="fileInput">
        <label>塊大小 (Chars):</label>
        <input type="number" id="chunkSize" value="120" style="width: 70px;">
        <label>輪播速度 (ms):</label>
        <input type="number" id="speedMs" value="300" style="width: 70px;">
        <button id="startBtn" disabled>開始自動輪播</button>
        <button id="stopBtn" disabled>停止</button>
        
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <div class="meta-info" id="statusText">請先選擇要傳輸的檔案</div>
    </div>

    <!-- 光學擷取區域 -->
    <div id="displayBox">
        <span style="color: #666;">等待檔案載入...</span>
    </div>
</div>

<script>
    let chunks = [];
    let currentIdx = 0;
    let fileName = "";
    let timer = null;

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileName = file.name;
        const chunkSize = parseInt(document.getElementById('chunkSize').value);

        const reader = new FileReader();
        reader.onload = (evt) => {
            const bytes = new Uint8Array(evt.target.result);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const fullBase64 = btoa(binary);

            chunks = [];
            for (let i = 0; i < fullBase64.length; i += chunkSize) {
                chunks.push(fullBase64.substring(i, i + chunkSize));
            }

            currentIdx = 0;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('statusText').innerText = `檔案就緒：${fileName} | 共 ${chunks.length} 個文字塊`;
            renderChunk();
        };
        reader.readAsArrayBuffer(file);
    });

    function renderChunk() {
        if (chunks.length === 0) return;
        
        const total = chunks.length;
        const idx = currentIdx + 1;
        // 格式： #STRT#|檔名|總塊數|當前塊數|PAYLOAD|#END#
        const payload = `#STRT#|${encodeURIComponent(fileName)}|${total}|${idx}|${chunks[currentIdx]}|#END#`;
        
        document.getElementById('displayBox').innerText = payload;
        
        const pct = ((idx / total) * 100).toFixed(1);
        document.getElementById('progressFill').style.width = `${pct}%`;
        document.getElementById('statusText').innerText = `正在播放區塊 [ ${idx} / ${total} ] (${pct}%) - 檔名: ${fileName}`;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        if (timer) clearInterval(timer);
        const speed = parseInt(document.getElementById('speedMs').value);
        
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;

        timer = setInterval(() => {
            currentIdx = (currentIdx + 1) % chunks.length; // 自動循環播放
            renderChunk();
        }, speed);
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (timer) clearInterval(timer);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
    });
</script>
</body>
</html>
