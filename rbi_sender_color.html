<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>極速 QR Code 傳送端</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #qrcode { padding: 15px; background: white; border-radius: 8px; }
    .controls { margin-bottom: 15px; }
    button { padding: 8px 16px; background: #008cba; color: white; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">開始極速廣播</button>
</div>

<div id="qrcode"></div>
<div id="status" style="margin-top: 15px;">請選擇檔案...</div>

<script>
const qrcodeContainer = document.getElementById('qrcode');
// 使用低容錯率 (Level L) 以換取極簡圖案與極高辨識速
let qrcode = new QRCode(qrcodeContainer, { 
  width: 320, 
  height: 320, 
  correctLevel: QRCode.CorrectLevel.L 
});

const CHUNK_SIZE = 180; // 適中容量：圖案稀疏、讀取極快
let chunks = [];
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請先選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const uint8Array = new Uint8Array(e.target.result);
    let binary = '';
    for (let i = 0; i < uint8Array.byteLength; i++) {
      binary += String.fromCharCode(uint8Array[i]);
    }
    const base64 = window.btoa(binary);

    chunks = [];
    for (let i = 0; i < base64.length; i += CHUNK_SIZE) {
      chunks.push(base64.slice(i, i + CHUNK_SIZE));
    }
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總影格數：${chunks.length}，極速廣播中...`;
    
    playNextFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playNextFrame() {
  if (!isTransmitting) return;

  const data = chunks[frameIndex];
  const header = String(frameIndex).padStart(4, '0') + String(chunks.length).padStart(4, '0');
  const payload = header + data;

  qrcode.clear();
  qrcode.makeCode(payload);

  frameIndex = (frameIndex + 1) % chunks.length;

  setTimeout(function() {
    requestAnimationFrame(playNextFrame);
  }, 60); // 16 FPS 極速播放
}
</script>
</body>
</html>
