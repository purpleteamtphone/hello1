<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>本機接收端 (Receiver)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #eef2f7; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0052a3; }
    #status { margin-top: 15px; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>接收端 (本機實體環境)</h2>
  <p>讀取剪貼簿內容，還原二進位資料並直接存檔至本機。</p>

  <div class="form-group">
    <label for="filename">存檔名稱：</label>
    <input type="text" id="filename" value="restored_file.msix">
  </div>

  <button onclick="restoreAndSave()">從剪貼簿讀取並儲存</button>

  <div id="status"></div>
</div>

<script>
async function restoreAndSave() {
  const statusEl = document.getElementById('status');
  const fileName = document.getElementById('filename').value || 'restored_file.bin';

  statusEl.style.color = '#333';
  statusEl.textContent = '讀取剪貼簿中...';

  try {
    // 1. 從實體機剪貼簿讀取文字內容
    const text = await navigator.clipboard.readText();

    if (!text.startsWith('TRANSFER_DATA:')) {
      statusEl.style.color = 'red';
      statusEl.textContent = '錯誤：剪貼簿內未發現有效的 TRANSFER_DATA 資料！';
      return;
    }

    // 2. 剝離標頭取得純 Base64
    const base64Data = text.replace('TRANSFER_DATA:', '');

    // 3. Base64 解碼為 Uint8Array
    const binaryString = atob(base64Data);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);

    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }

    // 4. 建立本機 Blob 物件
    const blob = new Blob([bytes], { type: 'application/octet-stream' });

    // 5. 觸發本機原生下載 (不經過 RBI)
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();

    // 6. 清理 DOM 與記憶體
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    statusEl.style.color = 'green';
    statusEl.textContent = `成功！檔案已下發儲存：${fileName} (${len} bytes)`;

  } catch (err) {
    statusEl.style.color = 'red';
    statusEl.textContent = '讀取失敗：' + err.message + ' (請確認已開啟剪貼簿存取權限)';
  }
}
</script>

</body>
</html>
