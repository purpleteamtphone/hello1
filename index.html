<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RBI Safe Storage Demo (Network Export)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>RBI 避檢測：讀取本地 EXE 並投射至 DevTools Network</h2>
  <button id="btn-process" onclick="processAndExpose()">1. 讀取 7z2602-x64.exe 並準備匯出</button>
  <div id="status">準備就緒</div>

  <script>
    // 1. 核心處理流程：Fetch 讀取同目錄下的 7z2602-x64.exe 並轉為 Blob
    async function processAndExpose() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = '正在讀取同目錄下的 7z2602-x64.exe...';

      try {
        // 從伺服器/同目錄抓取原始 EXE 檔案
        const response = await fetch('./7z2602-x64.exe');
        if (!response.ok) {
          throw new Error(`檔案讀取失敗，HTTP 狀態碼: ${response.status}`);
        }

        const fileBuffer = await response.arrayBuffer();
        
        // 建立記憶體 Blob 物件
        const restoredBlob = new Blob([fileBuffer], { type: 'application/octet-stream' });

        // 📌 關鍵：將 Blob 暴露至全域變數，供 DevTools 控制台隨時存取
        window.restoredBlob = restoredBlob;

        statusDiv.innerText = `✅ 檔案讀取成功！(大小: ${restoredBlob.size} bytes)，正在投射至 Network 面板...`;

        // 2. 觸發 Network 面板投射機制
        exposeToNetworkPanel(restoredBlob);

      } catch (err) {
        statusDiv.innerText = '處理過程發生錯誤: ' + err.message;
        console.error(err);
      }
    }

    // 2. 利用 Image 物件加載 Data URL，強制在 Chrome Network 面板留下標記
    function exposeToNetworkPanel(blob) {
      const reader = new FileReader();
      
      reader.onload = function () {
        const dataUrl = reader.result;

        // 建立隱藏 Image 載入 Data URL，這會強制 DevTools Network 面板捕捉該筆 200 OK 請求
        const img = new Image();
        img.src = dataUrl;

        const statusDiv = document.getElementById('status');
        statusDiv.innerText = `✅ 檔案已成功投射！請按 F12 打開 DevTools -> Network 面板，點擊 data:... 請求存檔。`;
        
        console.log("%c[RBI Export] ✅ 檔案已成功投射至 Network 面板！", "color: green; font-weight: bold; font-size: 14px;");
        console.log("全域 Blob 變數：window.restoredBlob", window.restoredBlob);
      };

      reader.readAsDataURL(blob);
    }
  </script>
</body>
</html>
