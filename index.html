<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>ArrayBuffer Fetch 範例</title>
</head>
<body>

  <h2>資料載入中...</h2>

  <script>
    async function fetchDataBuffer() {
      const fileUrl = 'https://raw.githubusercontent.com/purpleteamtphone/hello1/refs/heads/main/7z2602-x64.exe';

      try {
        // 1. 取得 Response 物件
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);

        // 2. 解析為 ArrayBuffer (在記憶體中持有原始二進位資料)
        const buffer = await response.arrayBuffer();

        console.log('ArrayBuffer 讀取成功，位元組長度:', buffer.byteLength);

        // 這裡可對 buffer 進行後續記憶體處理（例如 DataView 讀取、WebAssembly 傳遞或二進位運算）
        
      } catch (error) {
        console.error('Fetch 過程發生錯誤:', error);
      }
    }

    // 網頁 DOM 載入完成時自動觸發
    window.addEventListener('DOMContentLoaded', fetchDataBuffer);
  </script>

</body>
</html>
