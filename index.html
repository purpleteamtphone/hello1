<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Buffer 檢視與傳送至 Express</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; font-family: monospace; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Buffer 資訊檢視器</h2>
  <div id="output">載入中...</div>

  <!-- 按鈕：傳送 Buffer 至伺服器 -->
  <button id="sendBtn" style="display: none;" onclick="sendBufferToServer()">傳送 Buffer 到本地 Express 存檔</button>

  <script>
    let globalBuffer = null;

    async function inspectAndLoadBuffer() {
      const fileUrl = 'https://raw.githubusercontent.com/purpleteamtphone/hello1/refs/heads/main/7z2602-x64.exe';

      try {
        // 1. 全量載入檔案至記憶體 (ArrayBuffer)
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('檔案讀取失敗');

        globalBuffer = await response.arrayBuffer();

        // 2. 顯示前 64 個 Byte 的 Hex Dump
        const uint8Array = new Uint8Array(globalBuffer);
        const headerBytes = uint8Array.slice(0, 64);
        
        let hexString = '';
        headerBytes.forEach((byte, index) => {
          hexString += byte.toString(16).padStart(2, '0').toUpperCase() + ' ';
          if ((index + 1) % 16 === 0) hexString += '\n';
        });

        document.getElementById('output').innerHTML = `
          <p><strong>檔案總大小：</strong> ${globalBuffer.byteLength.toLocaleString()} Bytes</p>
          <p><strong>檔頭前 64 個 Byte (Hex Dump)：</strong></p>
          <pre>${hexString}</pre>
        `;

        // 顯示按鈕
        document.getElementById('sendBtn').style.display = 'inline-block';

      } catch (error) {
        document.getElementById('output').innerText = '載入失敗：' + error.message;
      }
    }

    // 將記憶體中的 ArrayBuffer 傳送到 Node.js Express 伺服器
    async function sendBufferToServer() {
      if (!globalBuffer) return;

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.innerText = '傳送中...';

      try {
        // 發送 POST 請求，直接將 ArrayBuffer 作為 body 傳送
        const response = await fetch('http://localhost:3000/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/octet-stream'
          },
          body: globalBuffer // 直接發送記憶體裡面的二進位 ArrayBuffer
        });

        const resultText = await response.text();

        if (response.ok) {
          alert('成功：' + resultText);
        } else {
          alert('失敗：' + resultText);
        }
      } catch (error) {
        console.error('傳送過程發生錯誤:', error);
        alert('傳送失敗，請確認 Express Server 是否正常運作');
      } finally {
        btn.disabled = false;
        btn.innerText = '傳送 Buffer 到本地 Express 存檔';
      }
    }

    window.addEventListener('DOMContentLoaded', inspectAndLoadBuffer);
  </script>

</body>
</html>
