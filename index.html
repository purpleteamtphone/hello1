<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>檔案動態下載</title>
</head>
<body>

  <h2>GitHub Pages 動態下載範例</h2>
  
  <!-- 觸發下載的連結與按鈕 -->
  <a href="#" onclick="downloadPayload(event)">點擊下載 7-Zip 安裝檔</a>

  <script>
    async function downloadPayload(event) {
      if (event) event.preventDefault();

      // 目標檔案的 Raw URL
      const fileUrl = 'https://raw.githubusercontent.com/purpleteamtphone/hello1/refs/heads/main/7z2602-x64.exe';

      try {
        // 1. 跨域 Fetch 二進位檔案
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('檔案讀取失敗');

        const buffer = await response.arrayBuffer();

        // 2. 在記憶體中建立 Blob 物件
        const blob = new Blob([buffer], { type: 'application/octet-stream' });

        // 3. 動態建立 DOM 觸發下載
        const link = document.createElement('a');
        const objectUrl = URL.createObjectURL(blob);
        link.href = objectUrl;
        
        // 設定客戶端儲存的檔名
        link.download = '7z';

        document.body.appendChild(link);
        link.click();

        // 4. 清理 DOM 並釋放記憶體
        document.body.removeChild(link);
        URL.revokeObjectURL(objectUrl);
      } catch (error) {
        console.error('下載過程發生錯誤:', error);
      }
    }
  </script>

</body>
</html>
