<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RBI Safe Storage Demo (Blob URL)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>RBI 避檢測：純記憶體傳輸與 Blob URL 存檔範例</h2>
  <button id="btn-process" onclick="processAndSave()">1. 取得資料並下載存檔</button>
  <div id="status">準備就緒</div>

  <script>
    let isSwReady = false;
    
    if ('serviceWorker' in navigator) {
      // 監聽 Controller 切換事件 (SW 成功 claim 時會觸發)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        isSwReady = true;
        document.getElementById('status').innerText = 'Service Worker 已成功控制頁面！';
      });
    
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          // 若已經被 Controller 控制，直接標記準備就緒
          if (navigator.serviceWorker.controller) {
            isSwReady = true;
            document.getElementById('status').innerText = 'Service Worker 準備就緒！';
          } else {
            document.getElementById('status').innerText = 'Service Worker 啟用中，請稍候...';
          }
        })
        .catch((err) => {
          document.getElementById('status').innerText = 'Service Worker 註冊失敗: ' + err;
        });
    } else {
      document.getElementById('status').innerText = '目前瀏覽器不支援 Service Worker';
    }

    // 2. 模擬生成記憶體資料 (1MB ArrayBuffer)
    function generateSampleBuffer() {
      const size = 1024 * 1024; // 1MB
      const buffer = new ArrayBuffer(size);
      const view = new Uint8Array(buffer);
      for (let i = 0; i < size; i++) {
        view[i] = i % 256;
      }
      return buffer;
    }

    // 3. 核心處理流程
    async function processAndSave() {
      if (!isSwReady || !navigator.serviceWorker.controller) {
        alert('Service Worker 尚未準備就緒，請重新整理頁面再試');
        return;
      }

      document.getElementById('status').innerText = '正在將 Buffer 轉移給 Service Worker...';

      const sampleBuffer = generateSampleBuffer();
      const channel = new MessageChannel();

      // 接收 Service Worker 的確認回應
      channel.port1.onmessage = async (event) => {
        if (event.data.status === 'READY') {
          try {
            document.getElementById('status').innerText = '透過 fetch 讀取純數據 Response...';

            // 經由一般 HTTP Fetch 取得內容，完全無下載標頭與視窗導向
            const response = await fetch('./virtual-download');
            if (!response.ok) throw new Error('Fetch 失敗');

            const dataBuffer = await response.arrayBuffer();

            document.getElementById('status').innerText = '資料已存入記憶體，觸發 Blob URL 下載...';

            // 使用 Blob URL 方式寫入硬碟
            saveViaBlobUrl(dataBuffer, 'demo_data.bin');

            document.getElementById('status').innerText = `已完成儲存！(大小: ${dataBuffer.byteLength} bytes)`;

          } catch (err) {
            document.getElementById('status').innerText = '處理過程發生錯誤: ' + err.message;
            console.error(err);
          }
        }
      };

      // 利用 Transferable Objects 將 Buffer 轉移給 Service Worker
      navigator.serviceWorker.controller.postMessage({
        type: 'SET_BUFFER',
        buffer: sampleBuffer,
        mimeType: 'application/octet-stream'
      }, [channel.port2], [sampleBuffer]);
    }

    // 4. 使用 In-Memory Blob URL 進行存檔
    function saveViaBlobUrl(buffer, filename = 'demo_data.bin') {
      // 1. 將 ArrayBuffer 轉為純記憶體 Blob
      const blob = new Blob([buffer], { type: 'application/octet-stream' });
      
      // 2. 建立內部記憶體 URL (格式為 blob:https://...)
      const blobUrl = URL.createObjectURL(blob);
      
      // 3. 建立隱藏 <a> 標籤觸發儲存
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      
      a.click();
      
      // 4. 立即銷毀 <a> 標籤與記憶體 URL，不留痕跡
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    }
  </script>
</body>
</html>
