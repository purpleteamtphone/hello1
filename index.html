<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Service Worker 虛擬流式下載</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 15px; color: #333; }
  </style>
</head>
<body>

  <h2>Service Worker 記憶體資料下載範例</h2>
  <button id="downloadBtn" onclick="triggerServiceWorkerDownload()">下載記憶體中的 Buffer</button>
  <div id="status">正在初始化 Service Worker...</div>

  <script>
    let isSwReady = false;

    // 1. 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          document.getElementById('status').innerText = 'Service Worker 註冊成功！';
          isSwReady = true;
        })
        .catch((err) => {
          document.getElementById('status').innerText = 'Service Worker 註冊失敗: ' + err;
        });
    } else {
      document.getElementById('status').innerText = '目前瀏覽器不支援 Service Worker';
    }

    // 2. 模擬生成或讀取記憶體資料 (ArrayBuffer)
    function generateSampleBuffer() {
      const size = 1024 * 1024; // 1MB 範例資料
      const buffer = new ArrayBuffer(size);
      const view = new Uint8Array(buffer);
      for (let i = 0; i < size; i++) {
        view[i] = i % 256;
      }
      return buffer;
    }

    // 3. 觸發下載流程
    async function triggerServiceWorkerDownload() {
      if (!isSwReady || !navigator.serviceWorker.controller) {
        alert('Service Worker 尚未準備就緒，請重新整理頁面再試');
        return;
      }

      document.getElementById('status').innerText = '正在將 Buffer 傳送給 Service Worker...';

      const sampleBuffer = generateSampleBuffer();
      const channel = new MessageChannel();

      // 接收 Service Worker 的確認回應
      channel.port1.onmessage = (event) => {
        if (event.data.status === 'READY') {
          document.getElementById('status').innerText = '資料已傳送，觸發下載中...';
          
          // 導向虛擬路由，觸發 Service Worker 攔截並下載
          window.location.href = './virtual-download';
        }
      };

      // 將 ArrayBuffer 轉移給 Service Worker (利用 Transferable Objects 避免複製開銷)
      navigator.serviceWorker.controller.postMessage({
        type: 'SET_BUFFER',
        buffer: sampleBuffer,
        filename: 'demo_data.bin',
        mimeType: 'application/octet-stream'
      }, [channel.port2], [sampleBuffer]);
    }
  </script>

</body>
</html>
