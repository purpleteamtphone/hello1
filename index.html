<script>
  let isSwReady = false;

  // 1. 註冊 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then((registration) => {
        document.getElementById('status').innerText = 'Service Worker 註冊成功！';
        isSwReady = true;
      })
      .catch((err) => {
        document.getElementById('status').innerText = 'Service Worker 註冊失敗: ' + err;
      });
  } else {
    document.getElementById('status').innerText = '目前瀏覽器不支援 Service Worker';
  }

  // 2. 模擬生成記憶體資料
  function generateSampleBuffer() {
    const size = 1024 * 1024; // 1MB
    const buffer = new ArrayBuffer(size);
    const view = new Uint8Array(buffer);
    for (let i = 0; i < size; i++) {
      view[i] = i % 256;
    }
    return buffer;
  }

  // 3. 觸發 Response 取回流程（不觸發檔案下載行為）
  async function triggerServiceWorkerFetch() {
    if (!isSwReady || !navigator.serviceWorker.controller) {
      alert('Service Worker 尚未準備就緒，請重新整理頁面再試');
      return;
    }

    document.getElementById('status').innerText = '正在將 Buffer 傳送給 Service Worker...';

    const sampleBuffer = generateSampleBuffer();
    const channel = new MessageChannel();

    channel.port1.onmessage = async (event) => {
      if (event.data.status === 'READY') {
        document.getElementById('status').innerText = '資料已就緒，經由 Fetch 讀取內文...';

        // 使用 fetch 存取 Service Worker 攔截的虛擬路由
        // 這是一個純 HTTP 請求，不會改變視窗位置、不會觸發瀏覽器下載框
        const response = await fetch('./virtual-download');
        const downloadedBuffer = await response.arrayBuffer();

        document.getElementById('status').innerText = `已成功接收純數據，大小為: ${downloadedBuffer.byteLength} bytes (無觸發下載行為)`;
      }
    };

    // 將 ArrayBuffer 轉移給 Service Worker
    navigator.serviceWorker.controller.postMessage({
      type: 'SET_BUFFER',
      buffer: sampleBuffer,
      mimeType: 'application/octet-stream'
    }, [channel.port2], [sampleBuffer]);
  }
</script>
