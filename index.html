<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>ArrayBuffer 資訊檢視</title>
  <style>
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>

  <h2>Buffer 資訊檢視器</h2>
  <div id="output">載入中...</div>

  <script>
    async function inspectBuffer() {
      const fileUrl = 'https://raw.githubusercontent.com/purpleteamtphone/hello1/refs/heads/main/7z2602-x64.exe';

      try {
        const response = await fetch(fileUrl);
        const buffer = await response.arrayBuffer();

        // 讀取前 64 個位元組進行 Hex 檢視
        const uint8Array = new Uint8Array(buffer);
        const headerBytes = uint8Array.slice(0, 64);
        
        let hexString = '';
        headerBytes.forEach((byte, index) => {
          hexString += byte.toString(16).padStart(2, '0').toUpperCase() + ' ';
          if ((index + 1) % 16 === 0) hexString += '\n'; // 每 16 個 Byte 換行
        });

        // 呈現在網頁畫面上
        document.getElementById('output').innerHTML = `
          <p><strong>檔案總大小：</strong> ${buffer.byteLength.toLocaleString()} Bytes</p>
          <p><strong>檔頭前 64 個 Byte (Hex Dump)：</strong></p>
          <pre>${hexString}</pre>
        `;
      } catch (error) {
        document.getElementById('output').innerText = '載入失敗：' + error.message;
      }
    }

    window.addEventListener('DOMContentLoaded', inspectBuffer);
  </script>

</body>
</html>
