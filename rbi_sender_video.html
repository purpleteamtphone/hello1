<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RBI 畫面訊號傳送端 (對齊增強版)</title>
  <style>
    body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    canvas { border: 2px solid #555; background: black; image-rendering: pixelated; }
    .controls { margin-bottom: 15px; }
    button { padding: 8px 16px; background: #008cba; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput">
  <button id="btnStart">開始廣播訊號</button>
</div>

<!-- 畫布調整為 258x258 (包含 1px 紅色定位框) -->
<canvas id="canvas" width="258" height="258"></canvas>
<div id="status" style="margin-top: 10px;">請選擇檔案...</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CHUNK_SIZE = 2000; 
let chunks = [];
let frameIndex = 0;
let isTransmitting = false;

document.getElementById('btnStart').addEventListener('click', startTransmission);

function startTransmission() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("請先選擇檔案！");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const arrayBuffer = e.target.result;
    const uint8Array = new Uint8Array(arrayBuffer);
    
    let binary = '';
    for (let i = 0; i < uint8Array.byteLength; i++) {
      binary += String.fromCharCode(uint8Array[i]);
    }
    const base64 = window.btoa(binary);

    chunks = [];
    for (let i = 0; i < base64.length; i += CHUNK_SIZE) {
      chunks.push(base64.slice(i, i + CHUNK_SIZE));
    }
    
    frameIndex = 0;
    isTransmitting = true;
    document.getElementById('status').textContent = `總影格數：${chunks.length}，傳輸中...`;
    
    playNextFrame();
  };

  reader.readAsArrayBuffer(file);
}

function playNextFrame() {
  if (!isTransmitting) return;

  const data = chunks[frameIndex];
  const header = String(frameIndex).padStart(4, '0') + String(chunks.length).padStart(4, '0');
  const payload = header + data;

  // 清空畫布
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 258, 258);

  // 1. 繪製純紅色外框 (RGB: 255, 0, 0)，作為定位特徵
  ctx.strokeStyle = "#FF0000";
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, 258, 258);

  // 2. 繪製黑白資料區塊 (偏移 1px)
  ctx.fillStyle = "white";
  let binaryStr = "";
  for (let i = 0; i < payload.length; i++) {
    binaryStr += payload.charCodeAt(i).toString(2).padStart(8, '0');
  }

  for (let i = 0; i < binaryStr.length; i++) {
    if (binaryStr[i] === '1') {
      const x = (i % 256) + 1;
      const y = Math.floor(i / 256) + 1;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  frameIndex = (frameIndex + 1) % chunks.length;

  setTimeout(function() {
    requestAnimationFrame(playNextFrame);
  }, 60);
}
</script>
</body>
</html>
